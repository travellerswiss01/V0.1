name: V0.1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run test:approval
      - run: npm run test:idempotency
      - run: npm run test:control-panel
      - run: npm run test:failure
      - run: npm run test:lock
      - run: npm run test:budget
      - run: npm run test:memory
      - run: npm run test:ceo-tools
      - run: npm run test:ceo-loop
      - run: npm run test:code-agent-2
      - run: npm run test:code-review
      - run: npm run test:automatic-fix-loop
      - run: npm run test:control-room-2
      - run: npm run test:market-intelligence
      - run: npm run test:failure
      - run: npm run test:smoke
      - run: npm run test:e2e
      - run: npm run test:metrics
      - run: npm run test:strategy
      - run: npm run test:live-market-research
